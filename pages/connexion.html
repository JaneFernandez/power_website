    <link rel="stylesheet" href="../assets/css/common.css" />
    <link rel="stylesheet" href="../assets/css/connexion.css" />

    <!-- Fil d'Ariane structuré (Cr 1.e.3) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Accueil", "item": "https://www.powerwebsite.fr/pages/accueil.html" },
        { "@type": "ListItem", "position": 2, "name": "Connexion", "item": "https://www.powerwebsite.fr/pages/connexion.html" }
      ]
    }
    </script>
  </head>
  <body>
    <!-- Lien d'évitement (Cr 1.c.4) -->
    <a class="lien-evitement" href="#contenu-principal">Aller au contenu principal</a>

    <!-- Navigation cohérente avec le reste du site (Cr 1.e.10) -->
    <header>
      <nav aria-label="Navigation principale">
        <a href="../index.html">Quiz</a>
        <a href="accueil.html">Accueil</a>
        <a href="programmes.html">Programmes</a>
        <a href="contact.html">Contact</a>
        <button id="bouton-police-dyslexie" type="button" class="btn-accessibilite" aria-pressed="false">
          Police dyslexie
        </button>
      </nav>
    </header>

    <main id="contenu-principal">
      <h1>Bon retour</h1>
      <p>Connecte-toi à ton <strong>compte</strong></p>

      <form action="accueil.html" method="POST">
        <label for="champ-email" class="sr-only">Ton email</label>
        <input
          type="email"
          id="champ-email"
          name="email"
          placeholder="TON EMAIL"
          required
        />
        <br />

        <label for="champ-password" class="sr-only">Ton mot de passe</label>
        <input
          type="password"
          id="champ-password"
          name="password"
          placeholder="MOT DE PASSE"
          required
        />
        <br />

        <button type="submit" title="Envoyer le formulaire de connexion">Se connecter</button>
      </form>

      <p class="lien-secondaire">
        Pas encore de compte ? <a href="../index.html" title="Retour au quiz d'inscription">Inscris-toi ici</a>
      </p>
    </main>

    <footer class="pied-de-page">
      <p>&copy; 2026 Power Website - Tous droits réservés.</p>
    </footer>

    <script src="../assets/js/common.js"></script>
